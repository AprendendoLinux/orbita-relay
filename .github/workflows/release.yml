name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/AprendendoLinux/orbita-relay
          tags: |
            ghcr.io/aprendendolinux/orbita-relay-app:${{ steps.v.outputs.version }}
            ghcr.io/aprendendolinux/orbita-relay-app:latest
      - uses: docker/build-push-action@v6
        with:
          context: ./mta
          push: true
          platforms: linux/amd64,linux/arm64
          labels: org.opencontainers.image.source=https://github.com/AprendendoLinux/orbita-relay
          tags: |
            ghcr.io/aprendendolinux/orbita-relay-mta:${{ steps.v.outputs.version }}
            ghcr.io/aprendendolinux/orbita-relay-mta:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/AprendendoLinux/orbita-relay
          tags: |
            ghcr.io/aprendendolinux/orbita-relay-cli:${{ steps.v.outputs.version }}
            ghcr.io/aprendendolinux/orbita-relay-cli:latest
      - name: Build de teste do proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          load: true
          tags: orbita-relay-proxy:test
      - name: Smoke test do proxy
        run: |
          docker run -d --name px --read-only --tmpfs /tmp --tmpfs /run --cap-drop ALL \
            --security-opt no-new-privileges:true -e INFO=1 -e NETWORKS=1 \
            -v /var/run/docker.sock:/var/run/docker.sock:ro -p 127.0.0.1:2375:2375 orbita-relay-proxy:test
          sleep 3
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 -X "$1" "http://127.0.0.1:2375$2"; }
          set -x
          [ "$(code GET /version)" = 200 ]
          [ "$(code GET /info)" = 200 ]
          [ "$(code GET /networks/bridge)" = 200 ]
          [ "$(code GET /containers/json)" = 403 ]
          [ "$(code GET /events)" = 403 ]
          [ "$(code POST /networks/create)" = 403 ]
          docker rm -f px
      - name: Varredura do proxy (falha em HIGH/CRITICAL com correção)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/grype:v0.122.1 orbita-relay-proxy:test --only-fixed --fail-on high
      - uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          no-cache: true
          pull: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/AprendendoLinux/orbita-relay
            org.opencontainers.image.licenses=Apache-2.0
          tags: |
            ghcr.io/aprendendolinux/orbita-relay-proxy:${{ steps.v.outputs.version }}
            ghcr.io/aprendendolinux/orbita-relay-proxy:latest
