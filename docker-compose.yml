name: orbitarelay

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbita
      POSTGRES_DB: orbita
      POSTGRES_PASSWORD: ${ORBITA_DB_PASSWORD:-orbita}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [orbita]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbita -d orbita"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: "0.1.0"
    image: orbitarelay/app:0.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ORBITA_HTTP_PORT:-8080}:8080"
    volumes:
      - app-data:/data
      - mta-config:/config
      - mta-logs:/var/log/exim:ro
    networks: [orbita]

  mta:
    build: ./mta
    image: orbitarelay/mta:0.1.0
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - mta-config:/config:ro
      - mta-logs:/var/log/exim
      - mta-spool:/var/spool/exim4
      - mta-tls:/etc/exim4/tls

networks:
  orbita:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:0:0:28::/64

volumes:
  pgdata:
  app-data:
  mta-config:
  mta-logs:
  mta-spool:
  mta-tls:
