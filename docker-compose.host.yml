name: orbitarelay

# Variante com o MTA em network_mode: host (IP de origem real, IPv4 e IPv6, sem depender do IPv6 do Docker).
# Uso: docker compose -f docker-compose.host.yml up -d

# Banco de dados (MySQL). SSL: disable | preferred | required | skip-verify
# Para usar um MySQL externo, altere ORBITA_DB_HOST/PORT e remova o serviço "db" e o depends_on.
services:
  db:
    image: mysql:latest
    container_name: orbitarelay-db
    hostname: orbitarelay-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orbita
      MYSQL_USER: orbita
      MYSQL_PASSWORD: orbita
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    networks: [orbita]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  app:
    image: ghcr.io/aprendendolinux/orbita-relay-app:1.2.1
    container_name: orbitarelay-app
    hostname: orbitarelay-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      dockerproxy:
        condition: service_started
    environment:
      ORBITA_DB_HOST: db
      ORBITA_DB_PORT: "3306"
      ORBITA_DB_NAME: orbita
      ORBITA_DB_USER: orbita
      ORBITA_DB_PASSWORD: orbita
      ORBITA_DB_SSL: preferred
      ORBITA_DOCKER_API: http://dockerproxy:2375
    ports:
      - "8080:8080"
    volumes:
      - app-data:/data
      - mta-config:/config
      - mta-logs:/var/log/exim:ro
    networks: [orbita]

  mta:
    image: ghcr.io/aprendendolinux/orbita-relay-mta:1.2.1
    container_name: orbitarelay-mta
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - mta-config:/config:ro
      - mta-logs:/var/log/exim
      - mta-spool:/var/spool/exim4
      - mta-tls:/etc/exim4/tls

  # Proxy somente leitura da API do Docker: expõe apenas versão, info e redes, para o painel
  # diagnosticar o IPv6. Para desativar, remova este serviço e a variável ORBITA_DOCKER_API do app.
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: orbitarelay-proxy
    hostname: orbitarelay-proxy
    restart: unless-stopped
    environment:
      VERSION: "1"
      INFO: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [orbita]

networks:
  orbita:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:0:0:28::/64

volumes:
  dbdata:
  app-data:
  mta-config:
  mta-logs:
  mta-spool:
  mta-tls:
